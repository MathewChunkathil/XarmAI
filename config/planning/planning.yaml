# Planning / candidate generation tunables (IMPLEMENTATION_PLAN §5.6). Units: m, deg, scale 0..1.
schema_version: 1
yaw_offsets_deg: [0.0]            # deg, extra +/- delta added to each psi_k = yaw_c + k*90deg
grasp_height_offset_m: 0.0        # m, TCP z above cube centre (0 = fingertips at mid-height)
approach_distance_m: 0.10         # m, pregrasp above grasp
lift_distance_m: 0.08             # m, lift above grasp
table_clearance_m: 0.02           # m, pregrasp z must be >= table_top_z + this
max_velocity_scaling: 0.2         # commissioning limit (§5.8)
max_acceleration_scaling: 0.2     # commissioning limit (§5.8)

# ---- SIMULATION ONLY motion timing (sim/trajectory.py). All PLACEHOLDER, not hardware facts. ----
sim_velocity_scale: 0.5            # PLACEHOLDER: fraction of URDF joint velocity limit (3.14 rad/s) -> 1.57 rad/s
sim_joint_acc_limit_rad_s2: 2.5    # PLACEHOLDER, rad/s^2 per joint (= 5.0 x 0.5; xArm accel limit not identified)
sim_min_segment_s: 0.3             # PLACEHOLDER, s: shortest joint segment
sim_gripper_time_s: 0.6            # PLACEHOLDER, s: gripper open/close duration
sim_cartesian_peak_speed_m_s: 0.1  # PLACEHOLDER, m/s: starting peak TCP speed of straight vertical moves
